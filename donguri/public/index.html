<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>どんぐりFX</title>
<style>
:root{--bg:#f6efe2;--card:#fffaf0;--ink:#3b2a1a;--sub:#8a7560;--line:#e5d8c2;--up:#2e8b57;--dn:#d2503c;--acc:#b9772f}
@media(prefers-color-scheme:dark){:root{--bg:#1d1812;--card:#2a2219;--ink:#f1e6d3;--sub:#a99882;--line:#3d3226;--up:#5fcf8f;--dn:#ff7d68;--acc:#e0a050}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:30px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:19px;margin:4px 0}h2{font-size:14px;color:var(--sub);margin:0 0 8px}
input,button,select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px;background:var(--bg);color:var(--ink)}
button{cursor:pointer;background:var(--acc);color:#fff;border:0;font-weight:700}button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.login{max-width:360px;margin:60px auto;text-align:center}.login input{width:100%;margin:5px 0}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.err{color:var(--dn);min-height:20px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.wal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:700px){.wal{grid-template-columns:repeat(4,1fr)}}
.wal div{background:var(--bg);border-radius:10px;padding:8px}.wal b{display:block;font-size:16px;word-break:break-all}.wal small{color:var(--sub)}
.pairs{display:grid;gap:8px;grid-template-columns:1fr}@media(min-width:700px){.pairs{grid-template-columns:repeat(3,1fr)}}
.pair{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--card)}.pair.sel{border-color:var(--acc)}
.pair .p{font-size:20px;font-weight:800}.up{color:var(--up)}.dn{color:var(--dn)}
.main{display:grid;gap:12px;margin-top:12px}@media(min-width:800px){.main{grid-template-columns:2fr 1fr}}.main .card{margin:0}
canvas{width:100%;height:240px;display:block}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tabs button{padding:6px 10px;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.buy{background:var(--up)}.sell{background:var(--dn)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e0b44a,#f5d76e)}
.win{background:#f5d76e;color:#5a3d00;text-align:center;font-weight:800;padding:12px;border-radius:12px;margin-bottom:12px}
.list{font-size:13px;max-height:260px;overflow:auto}.list>div{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.list small{color:var(--sub)}.list button{padding:5px 10px;font-size:12px}
#msg{min-height:20px;font-size:13px;margin-top:6px}.hint{font-size:12px;color:var(--sub);margin-top:6px}
#toast{position:fixed;top:8px;left:8px;right:8px;z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:var(--acc);color:#fff;padding:10px 14px;border-radius:12px;max-width:520px;font-size:14px;box-shadow:0 4px 14px #0004;cursor:pointer}
.pane{display:none}
</style></head><body><div id="toast"></div><div class="wrap" id="app"></div>
<script>
const NAMES={d:'どんぐり',k:'くるみ',gd:'金のどんぐり',gk:'金のくるみ'};
const PAIRS={KD:{n:'くるみ/どんぐり',b:'k',q:'d'},GDD:{n:'金のどんぐり/どんぐり',b:'gd',q:'d'},GKK:{n:'金のくるみ/くるみ',b:'gk',q:'k'}};
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let token=localStorage.getItem('tk'),user=null,px={},prev={},sel='KD',range=300,pts=[],timers=[],mode='spot',btab='pos',shown=new Set();
const fmt=(x,d=2)=>Number(x).toLocaleString('ja-JP',{maximumFractionDigits:d});
const dg=k=>k=='KD'?3:0;
async function api(path,body){
  const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'エラー');return j;
}
function toast(t){const d=document.createElement('div');d.textContent=t;d.onclick=()=>d.remove();$('#toast').appendChild(d);setTimeout(()=>d.remove(),9000);
  try{if(window.Notification&&Notification.permission=='granted')new Notification('どんぐりFX',{body:t})}catch{}}
function loginView(){
  $('#app').innerHTML=`<div class="card login"><h1>🌰 どんぐりFX 🌰</h1><p style="color:var(--sub);font-size:13px">金のどんぐりをめざそう！</p>
  <input id="n" placeholder="なまえ" autocomplete="username"><input id="p" type="password" placeholder="パスワード（4文字以上）" autocomplete="current-password">
  <div class="err" id="e"></div><div class="row"><button id="li">ログイン</button><button class="ghost" id="rg">新規登録</button></div></div>`;
  const go=path=>async()=>{try{const j=await api(path,{name:$('#n').value.trim(),password:$('#p').value});token=j.token;localStorage.setItem('tk',token);user=j.user;start()}catch(e){$('#e').textContent=e.message}};
  $('#li').onclick=go('login');$('#rg').onclick=go('register');
}
function appView(){
  $('#app').innerHTML=`<div id="win"></div>
  <div class="card"><div class="top"><h1>🌰 <span id="un"></span> さんのへや</h1><div><button class="ghost" id="cl">🌰 拾う(+5,000)</button> <button class="ghost" id="lo">ログアウト</button></div></div>
  <div class="wal" id="wal"></div><p style="margin:10px 0 4px;font-size:13px">ぜんぶの価値：<b id="tot"></b> どんぐり</p>
  <div style="font-size:12px;color:var(--sub)">目標：金のどんぐり 1こ（<span id="gp"></span>）</div><div class="bar"><i id="gb"></i></div></div>
  <div class="pairs" id="pairs"></div>
  <div class="main"><div class="card"><h2 id="ct"></h2><div class="tabs" id="tabs"></div><canvas id="cv"></canvas></div>
  <div class="card"><div class="tabs"><button data-m="spot">現物</button><button data-m="lev">レバレッジ</button></div><div id="q"></div>
   <div id="m-spot"><input id="amt" type="number" inputmode="decimal" min="0" step="any" value="1" style="width:100%;margin-top:8px">
    <div class="row" style="margin-top:6px"><button class="ghost" id="mx1">買える最大</button><button class="ghost" id="mx2">持ってる全部</button></div>
    <div class="bs"><button class="buy" id="by">買う</button><button class="sell" id="sl">売る</button></div></div>
   <div id="m-lev" style="display:none"><div class="row" style="margin-top:8px"><input id="un2" type="number" inputmode="decimal" min="0" step="any" value="1"><select id="lv"><option>2</option><option>5</option><option selected>10</option><option>25</option></select></div>
    <div class="hint">左：数量　右：レバレッジ倍率</div><div id="lq" class="hint"></div>
    <div class="bs"><button class="buy" id="lg">ロング(上がる)</button><button class="sell" id="st">ショート(下がる)</button></div>
    <div class="hint">証拠金の80%を失うと自動で決済(ロスカット)されます。見ていない間も判定されます。</div></div>
   <div id="msg"></div></div></div>
  <div class="card" style="margin-top:12px"><div class="tabs" id="bt"><button data-b="pos">ポジション</button><button data-b="alert">アラート</button><button data-b="rank">ランキング</button><button data-b="hist">れきし</button><button data-b="note">おしらせ</button></div>
   <div class="pane" id="b-pos"><div class="list" id="pl"></div></div>
   <div class="pane" id="b-alert"><div class="row"><select id="ap"></select><select id="ad"><option value="above">以上になったら</option><option value="below">以下になったら</option></select></div>
    <div class="row" style="margin-top:6px"><input id="apr" type="number" inputmode="decimal" step="any" placeholder="価格"><button id="aa">追加</button></div>
    <div class="hint">開いていない間に条件を満たしても、次に開いたとき「おしらせ」に届きます。</div><div class="list" id="al" style="margin-top:6px"></div></div>
   <div class="pane" id="b-rank"><div class="list" id="rl">読み込み中…</div></div>
   <div class="pane" id="b-hist"><div class="list" id="hl"></div></div>
   <div class="pane" id="b-note"><div class="list" id="nl"></div></div></div>`;
  $('#un').textContent=user.name;
  $('#lo').onclick=()=>{localStorage.removeItem('tk');token=null;timers.forEach(clearInterval);loginView()};
  $('#cl').onclick=async()=>{try{user=await api('claim',{});say('どんぐりを拾った！')}catch(e){say(e.message,1)}};
  $('#by').onclick=()=>act(()=>api('trade',{pair:sel,side:'buy',amount:$('#amt').value}),'買いました');
  $('#sl').onclick=()=>act(()=>api('trade',{pair:sel,side:'sell',amount:$('#amt').value}),'売りました');
  $('#lg').onclick=()=>act(()=>api('open',{pair:sel,side:'long',units:$('#un2').value,lev:$('#lv').value}),'ロングを持ちました');
  $('#st').onclick=()=>act(()=>api('open',{pair:sel,side:'short',units:$('#un2').value,lev:$('#lv').value}),'ショートを持ちました');
  $('#mx1').onclick=()=>{const q=px[sel],p=PAIRS[sel];if(q)$('#amt').value=Math.floor(user.wallet[p.q]/q.ask*1e4)/1e4};
  $('#mx2').onclick=()=>{$('#amt').value=user.wallet[PAIRS[sel].b]};
  $('#un2').oninput=$('#lv').onchange=renderLq;$('#amt').oninput=renderQuote;
  $('#aa').onclick=()=>{if(window.Notification&&Notification.permission=='default')Notification.requestPermission();
    act(()=>api('alert',{pair:$('#ap').value,dir:$('#ad').value,price:$('#apr').value}),'アラートを追加しました')};
  $('#ap').innerHTML=Object.keys(PAIRS).map(k=>`<option value="${k}">${PAIRS[k].n}</option>`).join('');
  $('#pairs').onclick=e=>{const el=e.target.closest('[data-p]');if(el){sel=el.dataset.p;loadChart();render()}};
  $('#pl').onclick=e=>{const b=e.target.closest('[data-c]');if(b)act(()=>api('close',{id:b.dataset.c}),'決済しました')};
  $('#al').onclick=e=>{const b=e.target.closest('[data-d]');if(b)act(()=>api('alert/del',{id:b.dataset.d}),'消しました')};
  $('#bt').onclick=e=>{const b=e.target.closest('[data-b]');if(b){btab=b.dataset.b;if(btab=='rank')loadRank();render()}};
  $$('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
  $('#tabs').innerHTML=[['5分',300],['1時間',3600],['1日',86400],['1週間',604800]].map(([l,s])=>`<button data-r="${s}">${l}</button>`).join('');
  $$('[data-r]').forEach(b=>b.onclick=()=>{range=+b.dataset.r;loadChart();render()});
  render();loadChart();
}
async function act(fn,ok){try{user=await fn();say(ok)}catch(e){say(e.message,1)}}
function say(t,bad){const m=$('#msg');if(m){m.textContent=t;m.style.color=bad?'var(--dn)':'var(--up)'}render()}
const rate=p=>PAIRS[p].q=='k'&&px.KD?px.KD.mid:1;
function pnl(o){const q=px[o.pair];if(!q)return 0;const cur=o.side=='long'?q.bid:q.ask;return o.units*(o.side=='long'?cur-o.entry:o.entry-cur)*rate(o.pair)}
function total(){const w=user.wallet,K=px.KD?px.KD.mid:0,G=px.GDD?px.GDD.mid:0,GK=px.GKK?px.GKK.mid:0;
  return w.d+w.k*K+w.gd*G+w.gk*GK*K+user.positions.reduce((s,o)=>s+Math.max(0,o.margin+pnl(o)),0)}
function renderQuote(){const q=px[sel],p=PAIRS[sel];if(!q)return;const a=+$('#amt').value||0;
  $('#q').innerHTML=`買値 <b>${fmt(q.ask,3)}</b> ／ 売値 <b>${fmt(q.bid,3)}</b><br><small style="color:var(--sub)">${mode=='spot'?`買うと ${fmt(a*q.ask,2)} ${NAMES[p.q]}`:''}</small>`;renderLq()}
function renderLq(){const q=px[sel];if(!q||!$('#lq'))return;const u=+$('#un2').value||0,l=+$('#lv').value;const v=u*q.mid*rate(sel);
  $('#lq').innerHTML=`ポジション額 約${fmt(v,0)}どんぐり ／ 必要な証拠金 約<b>${fmt(v/l,0)}</b>どんぐり`}
function render(){
  if(!user||!$('#wal'))return;const w=user.wallet;
  $('#wal').innerHTML=Object.keys(NAMES).map(k=>`<div><small>${NAMES[k]}</small><b>${fmt(w[k],4)}</b></div>`).join('');
  $('#tot').textContent=fmt(total(),0);$('#gb').style.width=Math.min(100,w.gd*100)+'%';$('#gp').textContent=fmt(Math.min(100,w.gd*100),1)+'%';
  $('#win').innerHTML=w.gd>=1?'<div class="win">🎉 金のどんぐりをゲット！おめでとう！ 🎉</div>':'';
  $('#pairs').innerHTML=Object.keys(PAIRS).map(k=>{const q=px[k];if(!q)return'';const up=q.mid>=(prev[k]||q.mid);
    return`<div class="pair ${k==sel?'sel':''}" data-p="${k}"><small>${PAIRS[k].n}</small><div class="p ${up?'up':'dn'}">${fmt(q.mid,dg(k))}</div><small>売${fmt(q.bid,dg(k))} / 買${fmt(q.ask,dg(k))}</small></div>`}).join('');
  $('#ct').textContent=PAIRS[sel].n;
  $$('[data-r]').forEach(b=>b.classList.toggle('on',+b.dataset.r==range));
  $$('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
  $$('[data-b]').forEach(b=>b.classList.toggle('on',b.dataset.b==btab));
  $$('.pane').forEach(p=>p.style.display=p.id=='b-'+btab?'block':'none');
  $('#m-spot').style.display=mode=='spot'?'block':'none';$('#m-lev').style.display=mode=='lev'?'block':'none';
  renderQuote();
  $('#pl').innerHTML=user.positions.map(o=>{const pl=pnl(o),eq=o.margin+pl;return`<div><span>${PAIRS[o.pair].n}<br><small>${o.side=='long'?'ロング':'ショート'} ${fmt(o.units,4)} ×${o.lev}　建値 ${fmt(o.entry,dg(o.pair))}</small></span>
    <span style="text-align:right"><b class="${pl>=0?'up':'dn'}">${pl>=0?'+':''}${fmt(pl,0)}</b><br><small>証拠金 ${fmt(o.margin,0)} → ${fmt(Math.max(0,eq),0)}</small></span><button data-c="${o.id}">決済</button></div>`}).join('')||'<small>ポジションはありません</small>';
  $('#al').innerHTML=user.alerts.map(a=>`<div><span>${PAIRS[a.pair].n} が ${fmt(a.price,2)} ${a.dir=='above'?'以上':'以下'}</span><button class="ghost" data-d="${a.id}">消す</button></div>`).join('')||'<small>アラートはありません</small>';
  $('#hl').innerHTML=user.history.map(h=>{const t=new Date(h.t).toLocaleString('ja-JP'),n=PAIRS[h.pair].n;
    const s=h.kind=='open'?`【新規】${n} ${h.side=='long'?'ロング':'ショート'} ${fmt(h.units,4)} ×${h.lev} @${fmt(h.price,2)}`:(h.kind=='close'||h.kind=='losscut')?`【${h.kind=='close'?'決済':'ロスカット'}】${n} 損益 ${h.pnl>=0?'+':''}${fmt(h.pnl,0)}どんぐり`:`${n} ${h.side=='buy'?'買':'売'} ${fmt(h.amount,4)} @${fmt(h.price,2)}`;
    return`<div><span>${s}</span><small>${t}</small></div>`}).join('')||'<small>まだ取引なし</small>';
  $('#nl').innerHTML=user.notices.map(n=>`<div><span>${n.text}</span><small>${new Date(n.t).toLocaleString('ja-JP')}</small></div>`).join('')||'<small>おしらせはありません</small>';
  drawChart();
}
async function loadRank(){try{const j=await api('ranking');
  $('#rl').innerHTML=j.top.map((x,i)=>`<div><span>${i+1}. ${x.gold?'🏆':'🌰'} ${x.name.replace(/</g,'&lt;')}</span><b>${fmt(x.total,0)}</b></div>`).join('')+(j.me&&j.me.rank>20?`<div><span>…${j.me.rank}位 あなた</span><b>${fmt(j.me.total,0)}</b></div>`:'')+`<small>参加者 ${j.count}人（どんぐり換算）</small>`}catch{}}
async function loadChart(){try{pts=(await api('chart?pair='+sel+'&range='+range)).pts;drawChart()}catch{}}
function drawChart(){
  const c=$('#cv');if(!c||!pts.length)return;const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);const all=pts.concat(px[sel]?[px[sel].mid]:[]);let mn=Math.min(...all),mx=Math.max(...all);const pad=(mx-mn)*.1||1;mn-=pad;mx+=pad;
  const X=i=>i/(all.length-1)*(W-60),Y=v=>H-(v-mn)/(mx-mn)*(H-10)-5;
  const css=getComputedStyle(document.body),col=css.getPropertyValue(all[all.length-1]>=all[0]?'--up':'--dn');
  g.font='11px sans-serif';g.fillStyle=css.getPropertyValue('--sub');g.strokeStyle=css.getPropertyValue('--line');
  for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g.beginPath();g.moveTo(0,y);g.lineTo(W-58,y);g.stroke();g.fillText(fmt(v,sel=='KD'?2:0),W-56,y+4)}
  g.beginPath();all.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.strokeStyle=col;g.lineWidth=2;g.stroke();
}
async function pollPrices(){try{const j=await api('prices');for(const k in j.prices){prev[k]=px[k]?px[k].mid:j.prices[k].mid;px[k]=j.prices[k]}render()}catch{}}
async function pollMe(){try{user=await api('me');const un=user.notices.filter(n=>!n.seen&&!shown.has(n.id));
  if(un.length){un.reverse().forEach(n=>{shown.add(n.id);toast(n.text)});user=await api('seen',{})}render();if(btab=='rank')loadRank()}catch(e){if(/ログイン/.test(e.message)){token=null;localStorage.removeItem('tk');loginView()}}}
async function start(){appView();await pollPrices();await pollMe();timers=[setInterval(pollPrices,1500),setInterval(pollMe,5000),setInterval(loadChart,15000)]}
(async()=>{if(token){try{user=await api('me');start();return}catch{token=null;localStorage.removeItem('tk')}}loginView()})();
</script></body></html>
